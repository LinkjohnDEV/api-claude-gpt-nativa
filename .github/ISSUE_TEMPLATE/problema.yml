name: Relatar um problema
description: Algo não funcionou como esperado
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: "**Nunca cole a sua chave.** Troque por `lp_xxxx`."
  - type: input
    id: versao
    attributes:
      label: Versão do instalador
      placeholder: "v1.2.0"
    validations: { required: true }
  - type: input
    id: sistema
    attributes:
      label: Sistema e versão do Codex / Claude Code
      placeholder: "Windows 11, Codex Desktop 0.167"
    validations: { required: true }
  - type: textarea
    id: oque
    attributes:
      label: O que aconteceu
      description: Mensagem de erro exata ou print.
    validations: { required: true }
  - type: textarea
    id: esperado
    attributes:
      label: O que você esperava
